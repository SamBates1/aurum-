id: spy-gld-70-30-risk-cap
name: "B: 70/30 SPY/GLD with 20% risk cap"
version: 1
description: >-
  Same 70/30 mix, but each asset's share is cut to min(1, 20% / its 21-day volatility), checked daily and traded
  only when a weight is more than 5 points off target; the rest earns the T-bill rate. Tested in EXP-045: smaller
  worst fall but narrowly failed the pre-registered downturn test (2020). Runs as a SHADOW strategy only (D-034).
universe: [SPY, GLD]
base_weights: {SPY: 0.70, GLD: 0.30}
benchmark: spy-gld-70-30-monthly
schedule: {rebalance: daily, band: 0.05}
sizing: {method: vol_cap, target_vol: 0.20, vol_window: 21, max_weight: 1.0}
signals: []
exits: {}
execution:
  fill: open
  costs_bps: {SPY: 2, GLD: 3}
start: "2006-06-01"
