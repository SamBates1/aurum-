name: Data foundation

# Builds the investment universe from Alpaca's asset list (read-only), checks SEC point-in-time accounts, the
# pound/dollar rate and the event calendar, and commits the reports in research/universe/. No orders of any kind.
on:
  schedule:
    - cron: "41 23 * * 0"   # Sundays 23:41 UTC: weekly refresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-foundation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: SEC cache
        uses: actions/cache@v4
        with:
          path: data/sec
          key: sec-${{ github.run_id }}
          restore-keys: sec-
      - name: Build
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python scripts/build_data_foundation.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p research/universe
          git add -A -- research/universe
          git diff --cached --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "Data foundation: universe, SEC and calendar checks $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
