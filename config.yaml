# Aurum configuration. Every research choice lives here so runs are reproducible.
# Edit tickers to switch sector. Values marked "assumption" are judgement calls,
# not facts; the research script reports how sensitive results are to them.

universe:
  core: [GLD, SLV, GDX]        # gold, silver, gold-miner ETFs
  equities: [NEM, AEM, WPM]    # individual miners (fundamentals shown live)
  miner_benchmark: GDX         # benchmark for the individual miners

macro:
  yahoo:                        # daily closes from Yahoo Finance
    dxy: "DX-Y.NYB"             # US dollar index
    us10y: "^TNX"               # 10y Treasury yield
    vix: "^VIX"                 # equity volatility / risk appetite
    gold: "GC=F"                # gold futures (miners' main driver)
    spx: "^GSPC"                # equity market (miners are equities too)
    oil: "CL=F"                 # crude oil, proxy for miners' energy costs
  fred:                         # free FRED series (no API key needed)
    real_yield_10y: DFII10      # 10y TIPS real yield: gold's opportunity cost
    breakeven_10y: T10YIE       # 10y inflation expectations
  fred_lag_days: 2              # business days before a FRED value is assumed known
  cash_rate:
    fred: DTB3                  # 3-month T-bill: what uninvested cash earns, and Sharpe's risk-free rate
    fallback_annual: 0.0        # used only if the series can't be downloaded

data:
  start: "2010-01-01"
  cache_hours: 12               # reuse downloaded data younger than this
  max_stale_days: 4             # refuse to trade if the last bar is older than this (calendar days)
  min_history_days: 1000        # refuse to model a ticker with less history than this

model:
  horizon_days: 5               # label: is price higher 5 trading days ahead?
  threshold: 0.0                # "up" means forward return > threshold
  min_train_days: 756           # ~3 years before first out-of-sample prediction
  retrain_every_days: 63        # walk-forward retrain frequency (~quarterly)
  random_state: 0

strategy:                       # ONE definition, used by backtest, live signals and paper trading
  mode: vol_hold                # vol_hold = always invested, sized by volatility (adopted D-020); timing = v0.2 BUY/SELL signals
  vol_estimator: gvz            # gvz = 21-day vol x gold implied/realised ratio (adopted D-021); realised_21d = plain
  rebalance_band: 0.05          # vol_hold: resize only when the weight is off target by more than this
  rebalance: daily              # vol_hold: orders may be decided every day (owner's choice, D-027); weekly = Fridays only (D-022)
  weights: {ml: 0.6, technical: 0.4, sentiment: 0.0, fundamentals: 0.0}
  # Sentiment and fundamentals have no point-in-time history, so they cannot be
  # backtested. They are shown live for context with weight 0. Giving them
  # weight means trading something untested; the dashboard flags it if you do.
  buy_above: 0.20               # score >= this -> BUY (enter long if flat)
  sell_below: -0.20             # score <= this -> SELL (exit if long); in between -> HOLD
  ml_auc_floor: 0.50            # ML vote weighted by out-of-sample AUC: 0 at floor...
  ml_auc_full: 0.56             # ...full weight at this AUC (point-in-time in the backtest)
  ml_skill_min_obs: 252         # out-of-sample days needed before the ML gets any vote
  target_vol: 0.15              # exposure = min(1, target_vol / asset volatility)
  max_position_pct: 0.20        # cap per asset as a share of the whole portfolio
  stop_atr_mult: 2.0            # stop-loss distance below entry, in ATRs; never moved down
  stop_mode: intrabar           # stop fills when the low touches it (gap -> open), like a live stop order

costs:                          # one-way cost per trade in bps: spread + slippage + fees (assumption)
  default_bps: 10
  per_ticker: {GLD: 3, SLV: 5, GDX: 5, NEM: 8, AEM: 10, WPM: 10}
  sensitivity_bps: [0, 5, 10, 25, 50]

research:
  holdout_start: "2024-01-01"   # untouched out-of-sample period, reported separately
  bootstrap_reps: 1000
  bootstrap_block_days: 21      # mean block length for the stationary bootstrap
  threshold_grid: [0.1, 0.2, 0.3]
  seed: 42

signals:                        # live-only context
  news_max_age_days: 7
  news_aliases:                 # extra Yahoo tickers whose headlines also count
    GLD: ["GC=F"]
    SLV: ["SI=F"]
    GDX: ["GC=F", "NEM"]

paper:
  starting_cash: 10000
  ledger_path: paper_ledger.json          # legacy gold vol_hold ledger (engine: legacy)
  engine: spec                  # spec = paper-trade the approved strategy definitions below (owner's Option 3, D-034)
                                # legacy = the gold vol_hold bot (strategy: section above)
  strategies:                   # each runs in its own ledger (committed: the official paper account runs daily on GitHub,
                                # .github/workflows/paper-trading.yml); every eligibility gate must pass (aurum/gates.py)
    - {file: strategies/spy-gld-70-30-monthly.yaml, role: main, ledger: research/paper/ledger-main.json}
    - {file: strategies/spy-gld-70-30-risk-cap.yaml, role: shadow, ledger: research/paper/ledger-shadow.json}

risk:                           # independent risk engine (aurum/risk.py); it can only cut risk. Changes need owner approval
  allowed_assets: [SPY, QQQ, IWM, EFA, TLT, IEF, GLD, SLV, GDX, DBC]
  max_gross: 1.0                # no borrowing
  max_weight_per_asset: 0.85
  max_turnover_per_day: 1.0     # share of the account traded in one day
  account_drawdown_halt: 0.35   # paper account this far below its peak: block purchases until the owner reviews
  vol_spike_ratio: 4.0          # block purchases of an asset whose 21-day volatility is over 4x its 1-year median
  max_data_age_days: 4
  min_order_value: 25

registry:                       # experiment registry (aurum/registry.py), local and git-ignored
  path: logs/registry.sqlite
  prior_trials: 100             # portfolio variants already tested in EXP-020..045, counted when deflating Sharpe

live:
  interval: 5m
  refresh_seconds: 60
  use_partial_bar: false        # false = signals use completed daily bars only, exactly as backtested
  trading_enabled: true         # off switch: false (or a file named STOP_TRADING in the project folder) blocks all orders
  max_orders_per_day: 12        # safety limit on orders per day across all assets
  max_price_jump: 0.25          # block an order if the price is more than 25% from the last close (bad data)
  decision_log: logs/decisions.jsonl   # one structured record per planned or blocked order (git-ignored)

offline: false                  # true = clearly-labelled synthetic data, no internet needed
