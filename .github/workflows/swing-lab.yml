name: Swing lab (EXP-052)

# Pre-registered swing exit test on real data (Alpaca prices read-only). Commits the results folder.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Run EXP-052
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python scripts/run_swinglab.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- research/experiments/results
          git diff --cached --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "EXP-052 swing lab results (real data)"
          git pull --rebase origin main
          git push origin HEAD:main
