name: Experiments

# Runs the research report and the pre-registered experiments on real market data on
# GitHub's machines, then commits the results back to the repository.
# Start a run by: pushing a change to research/experiments/RUN (what Claude does; its "run:" lines
# choose which experiment runs to do),
# the "Run workflow" button in the Actions tab, or the optional weekly schedule below.
on:
  push:
    branches: [main]
    paths: [research/experiments/RUN]
  workflow_dispatch:
    inputs:
      quick:
        description: "Quick mode (yearly retraining, fewer bootstrap draws)"
        type: boolean
        default: false
  # schedule:
  #   - cron: "17 2 * * 1"   # uncomment for a weekly run (Mondays 02:17 UTC)

permissions:
  contents: write   # needed only to commit the results

concurrency:
  group: experiments
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Research report
        run: python run_research.py 2>&1 | tee research-run.log
        shell: bash -o pipefail {0}
      - name: Experiments
        # Each line of research/experiments/RUN starting with "run:" is one experiment run ("lab:" = one run_lab.py run), e.g.
        #   run: --fill close
        # With no "run:" lines: one run, quick if the first word of RUN is "quick" or the button asked for it.
        run: |
          : > experiments-run.log
          if [ "${{ inputs.quick }}" = "true" ] || grep -qi '^quick' research/experiments/RUN 2>/dev/null; then
            default_args="--quick"
          else
            default_args=""
          fi
          lines=$(grep '^run:' research/experiments/RUN 2>/dev/null | sed 's/^run://' || true)
          labs=$(grep '^lab:' research/experiments/RUN 2>/dev/null | sed 's/^lab://' || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then lines="$default_args"; labs=""; fi
          if [ -z "$lines" ] && [ -z "$labs" ]; then lines="$default_args"; fi
          status=0
          if [ -n "$lines" ]; then
            while IFS= read -r args; do
              echo "=== python run_experiments.py $args ===" | tee -a experiments-run.log
              python run_experiments.py $args 2>&1 | tee -a experiments-run.log || status=1
            done <<< "$lines"
          fi
          # "lab:" lines run the research lab (run_lab.py): longer history, new assets, stage 5-8 ideas
          if [ -n "$labs" ]; then
            while IFS= read -r args; do
              echo "=== python run_lab.py $args ===" | tee -a experiments-run.log
              python run_lab.py $args 2>&1 | tee -a experiments-run.log || status=1
            done <<< "$labs"
          fi
          exit $status
        shell: bash -o pipefail {0}
      - name: Commit results (also on failure, with the logs)
        if: always()
        run: |
          mkdir -p research/experiments/logs
          tail -n 300 research-run.log > research/experiments/logs/last-research-run.log 2>/dev/null || true
          tail -n 300 experiments-run.log > research/experiments/logs/last-experiments-run.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- reports research/experiments
          git diff --cached --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "Automated run: research report and experiment results (${{ job.status }})"
          git pull --rebase origin main
          git push origin HEAD:main
