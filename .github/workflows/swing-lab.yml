name: Swing lab (EXP-052, EXP-053, EXP-054)

# Pre-registered swing exit test on real data (Alpaca prices read-only). Commits the results folder.
on:
  workflow_dispatch:
    inputs:
      exp:
        description: "052 (ladder exits), 053 (add to winners) or 054 (long-term loss limit)"
        default: "052"
      live:
        description: "true = corrected re-run with the live scanner's filters and entry (D-048)"
        default: "false"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Run the experiment
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          FLAG=""; if [ "${{ inputs.live }}" = "true" ]; then FLAG="--live"; fi
          if [ "${{ inputs.exp }}" = "054" ]; then python scripts/run_ltlab.py; exit 0; fi
          if [ "${{ inputs.exp }}" = "053" ]; then python scripts/run_addlab.py $FLAG; else python scripts/run_swinglab.py $FLAG; fi
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- research/experiments/results
          git diff --cached --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "EXP-${{ inputs.exp }} swing lab results (real data)"
          git pull --rebase origin main
          git push origin HEAD:main
