name: Alpaca check

# Checks the Alpaca connection with the keys stored as repository secrets and commits a short report
# (research/monitoring/alpaca-check.md). Market data only: no orders of any kind.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Check
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python scripts/alpaca_check.py
      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/monitoring/alpaca-check.md || true
          git diff --cached --quiet && exit 0
          git commit -m "Alpaca connection check"
          git pull --rebase origin main
          git push origin HEAD:main
